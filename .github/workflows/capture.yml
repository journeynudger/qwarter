# Captures the reference design and the WordPress site from a GitHub runner (which has the open
# internet) and publishes them to a branch, for a build environment whose network policy allows
# GitHub only. Run it from the Actions tab or the API (workflow_dispatch); then, locally:
#   git fetch origin captures && git checkout origin/captures -- .design-cache .port-cache
# Every step has its own time limit and the publish step always runs, so a site that never lets the
# capture finish (one that streams film on every page) still leaves what was taken on the branch.
name: Capture the reference design and the WordPress site

on:
  workflow_dispatch:
    inputs:
      design_origin:
        description: The reference design to capture completely (scripts/design/capture.mjs); "skip" to skip
        default: https://depoluxe.xyz
      design_args:
        description: Extra arguments for capture.mjs (routes, frames, video)
        default: --max 80 --video
      wordpress_origin:
        description: The WordPress site to snapshot through its REST API (scripts/port/fetch.py); "skip" to skip
        default: https://qwarter.com
      media_urls:
        description: Files to fetch as they are (one URL per line), saved under .port-cache/media/<host>/<path>
        default: ""
      shoot_specs:
        description: Sites to photograph (scripts/work/shoot.mjs), one per line — "<slug> <base> [name=route …] [--discover N]"; saved under .port-cache/shots/<slug>
        required: false
        default: skip
      film_specs:
        description: Sites to film scrolling (scripts/work/scrollfilm.mjs), one per line — "<slug> <base> [name=route[|click:selector][|live:seconds] …]"; saved under .port-cache/films/<slug>
        default: ""
      branch:
        description: The branch the captures are pushed to (replaced each run)
        default: captures

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y -qq ffmpeg # the recorder encodes its frames with it (the runner image has none)
      - name: Capture the design
        if: inputs.design_origin != 'skip' && inputs.design_origin != ''
        continue-on-error: true
        timeout-minutes: 45
        run: node scripts/design/capture.mjs --origin "${{ inputs.design_origin }}" --out .design-cache/reference ${{ inputs.design_args }}
      - name: Snapshot WordPress
        if: always() && inputs.wordpress_origin != 'skip' && inputs.wordpress_origin != ''
        continue-on-error: true
        timeout-minutes: 30
        run: python3 scripts/port/fetch.py --origin "${{ inputs.wordpress_origin }}"
      - name: Fetch files
        if: always() && inputs.media_urls != 'skip' && inputs.media_urls != ''
        continue-on-error: true
        timeout-minutes: 20
        env:
          URLS: ${{ inputs.media_urls }}
        run: |
          printf '%s\n' "$URLS" | while IFS= read -r u; do
            u="${u#"${u%%[![:space:]]*}"}"; [ -z "$u" ] && continue
            host="${u#*://}"; host="${host%%/*}"; rel="${u#*://*/}"; rel="${rel%%\?*}"
            mkdir -p ".port-cache/media/$host/$(dirname "$rel")"
            curl -sfL --retry 2 -A "Mozilla/5.0 (Macintosh) AppleWebKit/537.36 Chrome/124 Safari/537.36" "$u" -o ".port-cache/media/$host/$rel" && echo "fetched $u" || echo "FAILED $u"
          done
          du -sh .port-cache/media || true
      - name: Photograph sites
        if: always() && inputs.shoot_specs != 'skip' && inputs.shoot_specs != ''
        continue-on-error: true
        timeout-minutes: 60
        env:
          SPECS: ${{ inputs.shoot_specs }}
        run: |
          printf '%s\n' "$SPECS" | while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; [ -z "$line" ] && continue
            slug="${line%% *}"
            # shellcheck disable=SC2086
            timeout 1200 node scripts/work/shoot.mjs $line --out ".port-cache/shots/$slug" || echo "FAILED $slug"
          done
          du -sh .port-cache/shots || true
      - name: Film sites scrolling
        if: always() && inputs.film_specs != 'skip' && inputs.film_specs != ''
        continue-on-error: true
        timeout-minutes: 60
        env:
          SPECS: ${{ inputs.film_specs }}
        run: |
          printf '%s\n' "$SPECS" | while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"; [ -z "$line" ] && continue
            slug="${line%% *}"
            # shellcheck disable=SC2086
            timeout 1500 node scripts/work/scrollfilm.mjs $line --out ".port-cache/films/$slug" || echo "FAILED $slug"
          done
          du -sh .port-cache/films || true
      - name: Publish the captures to the branch
        # whatever a step managed before its time ran out is still worth having: this step always runs
        if: always()
        run: |
          set -e
          mkdir -p .design-cache .port-cache
          # GitHub refuses files over 100 MB: leave those out, but say which
          find .design-cache .port-cache -type f -size +95M -printf '%s %p\n' > .design-cache/too-large.txt || true
          find .design-cache .port-cache -type f -size +95M -delete || true
          du -sh .design-cache .port-cache || true
          git config user.name "qwarter capture"
          git config user.email "captures@users.noreply.github.com"
          git checkout -q --orphan "${{ inputs.branch }}"
          git rm -rq --cached .
          git add -f .design-cache .port-cache
          git -c commit.gpgsign=false commit -qm "Captures $(date -u +%FT%TZ): ${{ inputs.design_origin }}, ${{ inputs.wordpress_origin }}, $(ls .port-cache/shots 2>/dev/null | tr '\n' ' ')"
          git push -f origin "${{ inputs.branch }}"
